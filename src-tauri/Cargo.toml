[package]
name = "ja-netfilter-desktop"
version = "0.1.1"
description = "Desktop GUI for ja-netfilter — manage JetBrains javaagent, plugins, configs and vmoptions"
authors = ["Ming-QWQ520"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ja_netfilter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"

# 自定义授权：调用 ckey.run 生成授权文件。
# TLS 后端按平台拆分：Windows 走 schannel（native-tls，纯 Rust，
# 交叉编译无需 MSVC C 工具链）；Unix 走 rustls（避免 OpenSSL 依赖）。

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
