name: Release

# 触发方式（**仅手动**）：
#   Actions 页面 → Release → Run workflow
#   - tag 输入留空：自动取 tauri.conf.json 的版本号（如 v0.1.0）
#   - 也可填入已有 tag（需提前推送该 tag，如 v0.1.0）
# 构建完成后自动把 Windows 安装包发布到 GitHub Releases（Latest）。
# 仅编译 Windows 平台（用户实际使用平台，缩短构建时间）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to use the app version, e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Auto-detects version from `packageManager` field in package.json.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile=false

      # tag 规则：手动触发用输入值；没填则回退到 tauri.conf.json 的版本号。
      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ (github.event.inputs.tag || 'v__VERSION__') }}
          releaseName: "ja-netfilter Desktop ${{ (github.event.inputs.tag || 'v__VERSION__') }}"
          releaseBody: |
            ## ja-netfilter Desktop（Windows 安装包）

            - Windows x64：`*-setup.exe`（NSIS，默认按当前用户安装，无需管理员）/ `*.msi`

            ### 本版修复
            - 修复激活失效：自带的 power.conf 等资源过时（旧规则无法验证 ckey.run
              新生成的授权 key）。现在**安装前自动从 ckey.run 同步最新
              agent / 配置 / 插件**（与 ckey_script.ps1 同源同版本，就地更新、
              仍零复制），设置页新增「同步最新 Agent」手动按钮。
            - 修复 Windows 下 `-javaagent` 写入 verbatim 路径（`//?/E:/...`）导致
              IDE 启动报 "processing of -javaagent failed" 无法启动的问题。

            内置 ja-netfilter agent（lib.jar / 插件 / 配置），安装后**就地引用、零复制**。
            安装时自动清理旧的 `-javaagent` 行与 `<PRODUCT>_VM_OPTIONS` 环境变量，
            并按自定义授权信息（名称默认 Ming，到期默认 2099-12-31）生成 `<prd>.key` 授权文件。

            详细日志持久化在 `%APPDATA%\ja-netfilter-desktop\logs\`，反馈 issue 时请附上。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
