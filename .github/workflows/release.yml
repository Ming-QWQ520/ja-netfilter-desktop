name: Release

# 触发方式：
#   1. 推送 tag：git tag v0.1.0 && git push origin v0.1.0
#   2. 手动触发：Actions 页面 → Release → Run workflow（tag 留空则自动取
#      tauri.conf.json 的版本号，如 v0.1.0）
# 构建完成后自动把全平台安装包发布到 GitHub Releases（Latest）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to use the app version, e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Auto-detects version from `packageManager` field in package.json.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile=false

      # tag 规则：tag 推送用 tag 名；手动触发用输入值；都没填则回退到
      # tauri.conf.json 的版本号（tauri-action 的 __VERSION__ 占位符）。
      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || (github.event.inputs.tag || 'v__VERSION__') }}
          releaseName: "ja-netfilter Desktop ${{ github.event_name == 'push' && github.ref_name || (github.event.inputs.tag || 'v__VERSION__') }}"
          releaseBody: |
            ## ja-netfilter Desktop（跨平台安装包）

            - Windows：`*.msi` / `*-setup.exe`（NSIS，默认按当前用户安装，无需管理员）
            - macOS：`*.dmg`（Apple Silicon / Intel）
            - Linux：`*.deb` / `*.AppImage`

            内置 ja-netfilter agent（lib.jar / 插件 / 配置），安装后**就地引用、零复制**。
            安装时自动清理旧的 `-javaagent` 行与 `<PRODUCT>_VM_OPTIONS` 环境变量，
            并按自定义授权信息（名称默认 Ming，到期默认 2099-12-31）生成 `<prd>.key` 授权文件。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
